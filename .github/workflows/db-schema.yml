# Applies sql/schema.sql to the Supabase database whenever it changes on main.
# The file is safe to re-run (create or replace / if not exists / on conflict), and it runs
# in one transaction, so a failing statement changes nothing.
#
# Needs one repository secret: SUPABASE_DB_URL = the "Session pooler" connection string from
# Supabase (Connect button), with your database password filled in. It never appears in the code
# or the logs. Pull requests from forks don't get secrets, so they can't touch the database.
#
# Optional secret CHAT_SECRET (v1.10): the same random value as the Worker's CHAT_SECRET. It lets the
# database check that a reported chat line was really relayed by the game server. Stored in
# public.app_settings, readable only by the database functions.
name: Apply database schema

on:
  push:
    branches: [main]
    paths: ['sql/schema.sql']
  workflow_dispatch:

concurrency:
  group: db-schema
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Install psql
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      - name: Apply sql/schema.sql
        env:
          RAW_URL: ${{ secrets.SUPABASE_DB_URL }}
          CHAT_SECRET: ${{ secrets.CHAT_SECRET }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '20'
        run: |
          # tidy the secret: drop line breaks, spaces, quotes or backticks copied around it
          DATABASE_URL="$(printf '%s' "$RAW_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]"`'"'"']*//' -e 's/[[:space:]"`'"'"']*$//')"
          echo "::add-mask::$DATABASE_URL"
          if [ -z "$DATABASE_URL" ]; then echo "::error::Repository secret SUPABASE_DB_URL is not set"; exit 1; fi
          case "$DATABASE_URL" in postgresql://*|postgres://*) ;; *) echo "::error::SUPABASE_DB_URL must start with postgresql:// (paste the whole Session pooler URI, not only the password)"; exit 1;; esac
          case "$DATABASE_URL" in *'['*|*']'*) echo "::error::Put your real database password into the URI (without the [ ] brackets)"; exit 1;; esac
          case "$DATABASE_URL" in *'@db.'*'.supabase.co'*) echo "::error::This is the direct connection (IPv6 only). Use the Session pooler URI from Supabase > Connect"; exit 1;; esac
          if ! psql "$DATABASE_URL" -Atc 'select 1' > /dev/null; then
            echo "::error::Could not connect. Check the password (after a reset, wait 1-2 minutes); special characters in it must be URL-encoded (@ %40, # %23, / %2F, ? %3F, : %3A, % %25)."
            exit 1
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction -q -f sql/schema.sql
          echo "Schema applied."
          if [ -n "$CHAT_SECRET" ]; then
            echo "::add-mask::$CHAT_SECRET"
            # (psql fills :'s' only in scripts it reads, not in -c)
            echo "insert into public.app_settings (key, value) values ('chat_secret', :'s') on conflict (key) do update set value = excluded.value;" \
              | psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -v s="$CHAT_SECRET" -f -
            echo "Chat secret stored."
          else
            echo "CHAT_SECRET not set: chat reports stay off."
          fi
