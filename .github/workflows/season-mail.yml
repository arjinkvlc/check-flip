# Season e-mail: on the 1st–7th of every month, to players who ticked "e-mail me when a new season starts"
# (and have a real e-mail address), once per season, in the language they last used. At most 90 a day,
# so Resend's free plan (100 a day) is never exceeded; later runs that week send the rest.
#
# Needs two repository secrets:
#   SUPABASE_DB_URL  the same Session pooler URI the other database workflows use
#   RESEND_API_KEY   a Resend API key with "Sending access" (Resend → API Keys). Without it the run only warns.
# "Run workflow" with dry_run = true lists what would go out without sending anything.
name: Season e-mail

on:
  schedule:
    - cron: '7 6 1-7 * *'   # 09:07 Istanbul, days 1–7
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list what would be sent'
        type: boolean
        default: true

concurrency:
  group: season-mail
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Send
        env:
          RAW_URL: ${{ secrets.SUPABASE_DB_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          export DATABASE_URL="$(printf '%s' "$RAW_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]"`'"'"']*//' -e 's/[[:space:]"`'"'"']*$//')"
          echo "::add-mask::$DATABASE_URL"
          node tools/season-mail/send.mjs
