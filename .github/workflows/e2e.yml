# Runs the engine tests and the browser tests (tests/e2e) on every push and pull request.
# Everything runs inside GitHub's runner: a throwaway Postgres with the real sql/schema.sql, the
# Worker on wrangler dev and headless Chromium. No secrets are used, nothing touches the live site.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine and language tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: node tests/e2e/run-all.mjs
      - name: Keep screenshots and the Worker log when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: tests/e2e/.shots/
          retention-days: 7
