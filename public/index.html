<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Check Flip Roll the dice, draw cards, stay hungry and make your rivals pick up the check. A free 2–6 player browser game.">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="canonical" href="https://checkflipgame.com/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#1e3a4c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Check Flip">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Check Flip">
<meta property="og:title" content="Check Flip · Flip the check. Make them pay.">
<meta property="og:description" content="A free multiplayer board game about dice, cards and who picks up the check. Play with friends in your browser, no download.">
<meta property="og:url" content="https://checkflipgame.com/">
<meta property="og:image" content="https://checkflipgame.com/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Check Flip board game">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Check Flip · Flip the check. Make them pay.">
<meta name="twitter:description" content="A free multiplayer board game about dice, cards and who picks up the check.">
<meta name="twitter:image" content="https://checkflipgame.com/assets/og.png">
<title>Check Flip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>
/* a new service worker took over (new release): reload once so page, scripts and styles are all from the same version */
try{if(navigator.serviceWorker&&navigator.serviceWorker.controller){navigator.serviceWorker.addEventListener("controllerchange",function(){if(!sessionStorage.getItem("cf-swr")){sessionStorage.setItem("cf-swr","1");location.reload();}});}else{sessionStorage.removeItem("cf-swr");}setTimeout(function(){try{sessionStorage.removeItem("cf-swr");}catch(e){}},15000);}catch(e){}
</script>
<script>try{var th=localStorage.getItem("cf-theme");if(!th)th=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=th;}catch(e){}</script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><img class="logo-svg" src="assets/logo.svg" alt="" aria-hidden="true"><span data-i="title">Check Flip</span></div>
    <span id="roomChip" class="chip" hidden></span>
    <div class="spacer"></div>
    <button id="logBtn" class="iconbtn logbtn" data-a="log" data-ia="showLog" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></button>
    <button id="chatHdr" class="iconbtn chathdr" data-a="chatopen" data-ia="openChat" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="chatbadge" id="chatBadge2" hidden>0</span></button>
    <button id="moreBtn" class="iconbtn morebtn" data-a="more" data-ia="moreAria" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
    <div class="tgls" id="tgls"><button id="langBtn" class="iconbtn langbtn" data-a="lang">TR</button>
    <button id="musicBtn" class="iconbtn" data-a="music" data-ia="music"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
    <button id="sndBtn" class="iconbtn" data-a="snd" data-ia="sound"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path class="w" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/><path class="x" d="M22 9l-6 6M16 9l6 6"/></svg></button>
    <button id="themeBtn" class="iconbtn" data-a="theme" data-ia="themeAria"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path class="moon" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/><g class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg></button></div>
    <div id="acctChip" class="acctchip" hidden></div>
    <button id="logoutBtn" class="iconbtn logoutbtn" data-a="logout" data-ia="aLogout" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    <button id="leaveBtn" class="iconbtn leavebtn" data-a="leave" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="lt" data-i="leaveLong"></span><span class="st" data-i="leave"></span></button>
  </header>

  <section id="home" class="home">
    <div class="hmain">
      <p class="eyebrow" data-i="tagline"></p>
      <h1 data-i="heroQ"></h1>
      <div id="nickWrap" class="nickwrap">
        <label for="nm" data-i="nickLabel"></label>
        <input id="nm" maxlength="14" autocomplete="nickname">
      </div>
      <div class="seg2" id="homeMode" role="group" data-ia="modeLbl"><button data-a="hmode" data-m="classic"></button><button data-a="hmode" data-m="quick"></button></div>
      <button id="btnQuick" class="bigplay" data-a="quick" disabled><span><b data-i="quickTitle"></b><small data-i="quickSub"></small></span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <button id="btnRejoin" class="btn" data-a="rejoin" hidden></button>
      <p id="homeErr" class="err" hidden></p>
      <div class="tiles">
        <button class="tile" data-a="friendsPlay" id="tileFriends" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span><b data-i="tFriends"></b><small data-i="tFriendsSub"></small></span></button>
        <button class="tile" data-a="solo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4"/><circle cx="12" cy="3" r="1"/><circle cx="9" cy="14" r="1.2"/><circle cx="15" cy="14" r="1.2"/></svg><span><b data-i="tBots"></b><small data-i="tBotsSub"></small></span></button>
        <button class="tile" data-a="local"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M11 18h2"/></svg><span><b data-i="tLocal"></b><small data-i="tLocalSub"></small></span></button>
      </div>
      <div class="roompanel" id="roomPanel" hidden>
        <button id="btnCreate" class="btn primary" data-a="create" data-i="createPrivate" disabled></button>
        <div class="row">
          <input id="code" maxlength="5" data-ip="codePh" autocapitalize="characters" autocomplete="off" data-ia="codeAria">
          <button id="btnJoin" class="btn" data-a="join" data-i="join" disabled></button>
        </div>
      </div>
      <p id="netNote" class="note"></p>
    </div>
    <aside class="hfelt" aria-hidden="true">
      <div class="hrec"><b data-i="recHd"></b><hr><span><i data-i="rec1"></i><i>45</i></span><span><i data-i="rec2"></i><i>210</i></span><span><i data-i="rec3"></i><i>95</i></span><hr><span class="tot"><i data-i="recTot"></i><i>350</i></span><em>?</em></div>
      <img class="hav a1" src="assets/avatars/foodie.svg" alt=""><img class="hav a2" src="assets/avatars/grandma.svg" alt=""><img class="hav a3" src="assets/avatars/barista.svg" alt=""><img class="hav a4" src="assets/avatars/waiter.svg" alt="">
    </aside>
    <div class="hstrip">
      <div id="acct" class="acct" hidden></div>
      <div class="hlinks">
        <button class="pill" data-a="leaders"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg><span data-i="lbTitle"></span></button>
        <button class="pill" data-a="install" id="installBtn" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span data-i="installShort"></span></button>
      </div>
    </div>
    <details class="rules" id="rulesBox">
      <summary data-i="rulesTitle"></summary>
      <p class="lede" data-i="lede"></p>
      <ul id="rulesList"></ul>
      <p><button class="linkbtn" data-a="tipsreset" data-i="tipsReset"></button></p>
      <div class="cols" id="cardLists"></div>
    </details>
    <footer class="credit" style="grid-column:1/-1"><a href="https://github.com/arjinkvlc" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>Developed by <b>@arjinkvlc</b></a><a href="privacy.html" class="privlink" data-i="privacyLink"></a><span class="ver" id="verTag"></span></footer>
  </section>

  <section id="auth" class="lobby" hidden>
    <div class="box authbox" id="authBox"></div>
  </section>

  <section id="profile" class="profile" hidden>
    <div id="profileBox"></div>
  </section>

  <section id="friends" class="profile" hidden><div id="friendsBox"></div></section>
  <section id="leaders" class="profile" hidden><div id="leadersBox"></div></section>

  <section id="local" class="lobby" hidden>
    <div class="box">
      <h3 data-i="localTitle"></h3>
      <p class="note" data-i="localNote"></p>
      <div id="localNames" style="display:grid;gap:8px"></div>
      <div class="row">
        <button class="btn ghost" data-a="addp" data-i="addPlayer"></button>
        <div class="spacer"></div>
        <button class="btn ghost" data-a="leave" data-i="back"></button>
      </div>
      <label for="localMode" data-i="modeLbl"></label>
      <div class="cfgrow"><select id="localMode"><option value="classic" class="optMode" data-m="classic">Classic</option><option value="quick" class="optMode" data-m="quick">Quick</option><option value="teams" class="optMode" data-m="teams">2v2</option></select></div>
      <p class="note" id="localModeNote"></p>
      <label for="localMoney" data-i="startMoney"></label>
      <div class="cfgrow"><input id="localMoney" type="number" min="20" max="2000" step="10" inputmode="numeric"><span class="note" id="localMoneyNote"></span></div>
      <label for="localDays" data-i="dayLimit"></label>
      <div class="cfgrow"><select id="localDays"><option value="0" class="optOff">Off</option><option value="10" class="optDays">10 days</option><option value="15" class="optDays">15 days</option><option value="20" class="optDays">20 days</option><option value="25" class="optDays">25 days</option><option value="30" class="optDays">30 days</option></select></div>
      <button class="btn primary big" data-a="lstart" data-i="startGame"></button>
    </div>
  </section>

  <section id="solo" class="lobby" hidden>
    <div class="box">
      <h3 data-i="soloTitle"></h3>
      <p class="note" data-i="soloNote"></p>
      <label data-i="modeLbl"></label>
      <div class="seg3" id="soloMode"><button data-a="soloMode" data-m="classic"></button><button data-a="soloMode" data-m="quick"></button><button data-a="soloMode" data-m="teams"></button></div>
      <label data-i="tableSize"></label>
      <div class="seg3" id="soloCount"><button data-a="soloN" data-n="2"></button><button data-a="soloN" data-n="3"></button><button data-a="soloN" data-n="4"></button></div>
      <label data-i="yourAvatar"></label>
      <div class="avgrid" id="soloAv"></div>
      <label for="soloMoney" data-i="startMoney"></label>
      <div class="cfgrow"><input id="soloMoney" type="number" min="20" max="2000" step="10" inputmode="numeric"><span class="note" id="soloMoneyNote"></span></div>
      <label for="soloDays" data-i="dayLimit"></label>
      <div class="cfgrow"><select id="soloDays"><option value="0" class="optOff">Off</option><option value="10" class="optDays">10 days</option><option value="15" class="optDays">15 days</option><option value="20" class="optDays">20 days</option><option value="25" class="optDays">25 days</option><option value="30" class="optDays">30 days</option></select></div>
      <div class="row"><button class="btn ghost" data-a="leave" data-i="back"></button><button class="btn primary big" data-a="sstart" style="flex:1" data-i="startGame"></button></div>
    </div>
  </section>

  <section id="joining" class="lobby" hidden>
    <div class="box codebox"><p class="status" id="joinMsg"></p><p class="note" data-i="connectingNote"></p><div><button class="btn small ghost" data-a="leave" data-i="cancel"></button></div></div>
  </section>

  <section id="lobby" class="lobby" hidden>
    <div class="box codebox">
      <label data-i="roomCode"></label>
      <div class="coderow"><div class="big" id="lobbyCode"></div><button class="btn small" data-a="copycode" id="copyCodeBtn" data-i="copy"></button></div>
      <div><button class="btn small ghost" data-a="copy" data-i="copyInvite"></button></div>
      <p class="note" id="inviteTxt" style="word-break:break-all;user-select:all"></p>
      <p class="note" data-i="noLateJoin"></p>
    </div>
    <div class="box">
      <h3 data-i="pickAvatarTitle"></h3>
      <div class="avgrid" id="lobbyAv"></div>
      <p class="note" data-i="avatarNote"></p>
    </div>
    <ul id="lobbyList" class="plist"></ul>
    <div class="box" id="inviteBox" hidden></div>
    <div class="box" id="cfgBox">
      <h3 data-i="settings"></h3>
      <label for="modeSel" data-i="modeLbl"></label>
      <div class="cfgrow"><select id="modeSel"><option value="classic" class="optMode" data-m="classic">Classic</option><option value="quick" class="optMode" data-m="quick">Quick</option><option value="teams" class="optMode" data-m="teams">2v2</option></select></div>
      <p class="note" id="modeNote"></p>
      <label for="startMoney" data-i="startMoney"></label>
      <div class="cfgrow"><input id="startMoney" type="number" min="20" max="2000" step="10" inputmode="numeric"><button class="btn small ghost" data-a="autoMoney" id="autoMoneyBtn" data-i="auto"></button></div>
      <p class="note" id="moneyNote"></p>
      <label for="daysSel" data-i="dayLimit"></label>
      <div class="cfgrow"><select id="daysSel"><option value="0" class="optOff">Off</option><option value="10" class="optDays">10 days</option><option value="15" class="optDays">15 days</option><option value="20" class="optDays">20 days</option><option value="25" class="optDays">25 days</option><option value="30" class="optDays">30 days</option></select></div>
      <p class="note" id="daysNote"></p>
    </div>
    <div class="box" id="pubBox" hidden>
      <h3 data-i="pubTable"></h3>
      <p class="note" id="pubNote"></p>
      <button class="btn primary big" data-a="ready" id="readyBtn"></button>
    </div>
    <div id="lobbyAct"></div>
  </section>

  <section id="game" class="gamewrap" hidden>
    <aside id="pbox" class="box"><div class="pboxhead"><h3 data-i="players"></h3><div class="rxbar"><button class="rxbtn" data-a="rxopen" data-ia="reactAria" aria-expanded="false"><svg class="rxicon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#ffc83d" stroke="#e0a800" stroke-width="1"/><ellipse cx="8.6" cy="9.6" rx="1.3" ry="1.7" fill="#3b2a1a"/><ellipse cx="15.4" cy="9.6" rx="1.3" ry="1.7" fill="#3b2a1a"/><path d="M7.2 13.6 Q12 18.4 16.8 13.6" fill="none" stroke="#3b2a1a" stroke-width="1.7" stroke-linecap="round"/><ellipse cx="6.6" cy="13.2" rx="1.6" ry="1" fill="#ff8a65" opacity=".45"/><ellipse cx="17.4" cy="13.2" rx="1.6" ry="1" fill="#ff8a65" opacity=".45"/></svg></button><div class="rxlist" id="rxlist" hidden></div></div></div><ul id="players" class="players"></ul></aside>
    <div class="boardwrap">
      <div id="board" class="board">
        <div id="center" class="center">
          <div class="c-day" id="cDay"></div>
          <div class="dice" id="dice"><div class="die"></div><div class="die"></div></div>
          <div class="c-who" id="cWho"></div>
          <div class="c-sub" id="cSub"></div>
          <div class="ctimer" hidden><i></i></div>
          <div class="pop" id="pop" hidden></div>
        </div>
      </div>
    </div>
    <aside id="actions" class="box"></aside>
    <div class="sidetabs" id="sideTabs"><button class="stab on" data-a="stab" data-t="chat" id="stabChat"><span data-i="chat"></span><span class="chatbadge" id="chatBadge3" hidden>0</span></button><button class="stab" data-a="stab" data-t="log" data-i="events"></button></div>
    <section class="box logbox">
      <h3 class="logh" data-i="events"></h3>
      <ul id="log" class="log"></ul>
      <details class="rules" style="padding:10px 12px">
        <summary data-i="squaresCards"></summary>
        <div id="legend" class="cols"></div>
      </details>
    </section>
  <section class="box chatbox" id="chatbox" hidden>
      <div class="chathead"><h3 data-i="chat"></h3><button class="btn small ghost chatclose" data-a="chatclose" data-ia="closeChat">✕</button></div>
      <ul class="chatlist" id="chatList"><li class="chatempty"></li></ul>
      <form class="chatform" id="chatForm" autocomplete="off"><input id="chatIn" maxlength="200" data-ip="chatPh" data-ia="chatPh"><button class="btn primary" type="submit" data-i="send"></button></form>
    </section>
  </section>
  <button class="chatfab" id="chatFab" data-a="chatopen" data-ia="openChat" hidden>💬<span class="chatbadge" id="chatBadge" hidden>0</span></button>
  <footer class="credit" id="gameCredit" hidden><a href="https://github.com/arjinkvlc" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>Developed by <b>@arjinkvlc</b></a></footer>
</div>

<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" hidden><div class="modalcard" id="modalCard"></div></div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
